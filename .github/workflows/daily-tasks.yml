# 每日自动执行领克App签到 + 分享，并通过 Bark 推送结果。
# 敏感字段（账号 token/deviceId、应用签名密钥、Bark key）均通过仓库 Secrets
# 提供，代码中不含任何默认值，未配置会直接报错退出，获取方式见 readme.md。
# 说明：
#   - 登录环节存在滑块验证码，无法在 CI 中完全自动化，本工作流依赖
#     refreshToken 自动续期获取 token（约30天有效，需定期人工更新）。
#   - LYNKCO_APP_SECRETS 是领克官方 App 的应用级共用签名密钥集合
#     （非个人账号凭证），一个 JSON 字符串 Secret 整合以下 4 个独立字段，
#     必须配置，否则脚本无法计算请求签名。

name: LynkCoHelperRunner

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）执行，GitHub 调度有延迟（可能延后数分钟到
    # 数小时）。需要精确触发可用 iOS 快捷指令等定时调用 GitHub API 主动触发
    # （注意：API 路径中的 workflow 文件名需与本文件名保持一致）。
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  daily-tasks:

    runs-on: ubuntu-latest

    steps:
    - name: CheckOut
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f ./LynkCoHelper/requirements.txt ]; then pip install -r ./LynkCoHelper/requirements.txt; fi
    - name: Diagnose env.json location
      run: |
        echo "=== Current directory ==="
        pwd

        echo "=== Expected file ==="
        ls -la ./LynkCoHelper/env.json || true

        echo "=== Search generated file ==="
        find "$GITHUB_WORKSPACE" -type f -name "env.json" -print
    - name: 检查生成的 env.json
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        path = Path("./LynkCoHelper/env.json")
        print(f"env.json 存在: {path.is_file()}")

        if path.is_file():
            try:
                data = json.loads(path.read_text(encoding="utf-8"))
                print(f"JSON 格式正确: {isinstance(data, dict)}")
                print(f"顶层字段名: {list(data.keys())}")

                secrets = data.get("secrets", {})
                print(f"secrets 是字典: {isinstance(secrets, dict)}")
                if isinstance(secrets, dict):
                    for key in (
                        "nativeAppKey",
                        "nativeAppSecret",
                        "nativeAppCode",
                        "loginAppCode",
                    ):
                        value = secrets.get(key)
                        print(f"{key}: {'存在' if value else '缺失或为空'}")
            except Exception as exc:
                print(f"读取或解析失败: {type(exc).__name__}")
        PY
    - name: 检查领克认证变量
      env:
        LYNKCO_TOKEN: ${{ secrets.LYNKCO_TOKEN }}
        LYNKCO_REFRESH_TOKEN: ${{ secrets.LYNKCO_REFRESH_TOKEN }}
        LYNKCO_DEVICE_ID: ${{ secrets.LYNKCO_DEVICE_ID }}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
      run: |
        python - <<'PY'
        import os
        import json

        names = [
            "LYNKCO_TOKEN",
            "LYNKCO_REFRESH_TOKEN",
            "LYNKCO_DEVICE_ID",
            "LYNKCO_APP_SECRETS",
        ]

        for name in names:
            value = os.environ.get(name, "")
            print(f"{name}: {'已读取' if value.strip() else '缺失或为空'}: {value}")

        app_secrets = os.environ.get("LYNKCO_APP_SECRETS", "")
        if app_secrets.strip():
            try:
                data = json.loads(app_secrets)
                print(f"LYNKCO_APP_SECRETS JSON格式: 正确（{type(data).__name__}）")
            except (ValueError, TypeError):
                print("LYNKCO_APP_SECRETS JSON格式: 错误或不是JSON")
        PY
    - name: Validate LynkCo configuration
      env:
        LYNKCO_TOKEN: ${{ secrets.LYNKCO_TOKEN }}
        LYNKCO_REFRESH_TOKEN: ${{ secrets.LYNKCO_REFRESH_TOKEN }}
        LYNKCO_DEVICE_ID: ${{ secrets.LYNKCO_DEVICE_ID }}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
      run: |
        python - <<'PY'
        import json
        import os
        import sys

        names = [
            "LYNKCO_TOKEN",
            "LYNKCO_REFRESH_TOKEN",
            "LYNKCO_DEVICE_ID",
            "LYNKCO_APP_SECRETS",
        ]

        missing = []
        for name in names:
            value = os.environ.get(name, "")
            present = bool(value.strip())
            print(f"{name}: {'已配置' if present else '缺失或为空'}")
            if not present:
                missing.append(name)

        raw = os.environ.get("LYNKCO_APP_SECRETS", "")
        required = (
            "nativeAppKey",
            "nativeAppSecret",
            "nativeAppCode",
            "loginAppCode",
        )

        if raw.strip():
            try:
                data = json.loads(raw)
            except (ValueError, TypeError):
                print("LYNKCO_APP_SECRETS: JSON 解析失败")
                sys.exit(1)

            if not isinstance(data, dict):
                print("LYNKCO_APP_SECRETS: 顶层必须是 JSON 对象")
                sys.exit(1)

            print("LYNKCO_APP_SECRETS: JSON 格式正确")
            for key in required:
                present = isinstance(data.get(key), str) and bool(data[key].strip())
                print(f"字段 {key}: {'已配置' if present else '缺失或为空'}")
                if not present:
                    missing.append(f"LYNKCO_APP_SECRETS.{key}")

        if missing:
            print("配置检查未通过，请修复缺失项后重试。")
            sys.exit(1)

        print("配置完整性检查通过。")
        PY
    - name: Run sign-in and notify
      env:
        # refreshToken 自动续期获取 token，详见 lynkco_login.load_token()
        LYNKCO_TOKEN: ${{ secrets.LYNKCO_TOKEN }}
        LYNKCO_REFRESH_TOKEN: ${{ secrets.LYNKCO_REFRESH_TOKEN }}
        LYNKCO_DEVICE_ID: ${{ secrets.LYNKCO_DEVICE_ID }}
        # Bark 推送 key，详见 lynkco_notify.py
        LYNKCO_BARK_KEY: ${{ secrets.LYNKCO_BARK_KEY }}
        LYNKCO_FEISHU_WEBHOOK: ${{ secrets.LYNKCO_FEISHU_WEBHOOK }}
        LYNKCO_DINGTALK_WEBHOOK: ${{ secrets.LYNKCO_DINGTALK_WEBHOOK }}
        LYNKCO_WECOM_WEBHOOK: ${{ secrets.LYNKCO_WECOM_WEBHOOK }}
        # App 共用签名密钥集合（JSON 字符串，详见 lynkco_common.py），必须配置，
        # 否则脚本会在计算签名时报错退出。字段名与 env.json 的 secrets 段一致：
        # {"nativeAppKey":"","nativeAppSecret":"","nativeAppCode":"",
        #  "loginAppCode":""}
        LYNKCO_APP_SECRETS: ${{ secrets.LYNKCO_APP_SECRETS }}
        # Bark 推送图标 URL（可选项，不配则 Bark 使用默认图标）
        LYNKCO_BARK_ICON: ${{ secrets.LYNKCO_BARK_ICON }}
        LYNKCO_TIMEOUT: ${{ vars.LYNKCO_TIMEOUT || '30' }}
        LYNKCO_RETRIES: ${{ vars.LYNKCO_RETRIES || '2' }}
      run: |
        python ./LynkCoHelper/lynkco_daily_tasks.py
